[project]
name = "jake-tools"
version = "0.0.0"
description = "Internal tools used by Jake"
readme = "README.md"
authors = [
    { name = "Michael-F-Bryan", email = "michaelfbryan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "click>=8.4.1",
    "jinja2>=3.1.6",
    "mcp>=1.29.0,<2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "pytest-skip-slow>=1.1.0",
    "ruff>=0.15.18",
]

[project.scripts]
jake-tools = "jake_tools.__main__:main"
jake-tools-mcp = "jake_tools.mcp.__main__:main"

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
# The formatter owns line wrapping; E501 only fires on unsplittable strings.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not live\""
asyncio_mode = "auto"
markers = [
    "live: marks tests that hit real external services",
    "slow: marks tests as slow to run (pytest-skip-slow; skipped unless --slow is passed)",
]
