[project]
name = "inference-worker"
version = "0.1.0"
description = "Short-lived local inference worker: Parakeet ASR + Pyannote Community-1 diarisation behind a typed JSON request/response contract"
requires-python = ">=3.12,<3.13"
dependencies = [
    "parakeet-mlx>=0.5.2,<0.6",
    "pyannote-audio>=4.0.7,<5",
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not model\""
markers = [
    "model: marks tests that load real ML models (heavyweight, opt-in via -m model)",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
# The formatter owns line wrapping; E501 only fires on unsplittable strings.
ignore = ["E501"]
